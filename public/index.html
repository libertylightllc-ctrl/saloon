<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installable website: "Add to Home Screen" / "Install app" opens it full-screen with its own icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%WEB_TITLE%" />
    <meta name="theme-color" content="#6C45F2" />
    <meta name="description" content="Saloqo runs a barber shop or ladies salon from your phone: walk-ins and bookings, quick sales and receipts, daily cash closing, stock, staff and payroll, and your sales tax." />
    <link rel="canonical" href="https://www.saloqo.com/" />
    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saloqo" />
    <meta property="og:title" content="Saloqo · Run your salon from your phone" />
    <meta property="og:description" content="Walk-ins and bookings, quick sales, daily cash closing, stock, staff and payroll for barber shops and ladies salons." />
    <meta property="og:url" content="https://www.saloqo.com/" />
    <meta property="og:image" content="https://www.saloqo.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Saloqo · Run your salon from your phone" />
    <meta name="twitter:description" content="Walk-ins and bookings, quick sales, daily cash closing, stock, staff and payroll for barber shops and ladies salons." />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
